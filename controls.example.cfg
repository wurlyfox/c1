# c1 key bindings (example)
#
# Copy this file to controls.cfg and edit the copy to change the controls.
# controls.cfg is ignored by git, so your layout stays local. Without a
# controls.cfg the game uses the bindings below, which are built into the game.
#
# Each line binds a PlayStation button to a keyboard key:
#
#   button = key name
#
# Buttons: cross, square, circle, triangle, l1, r1, l2, r2, l3, r3,
#          up, down, left, right, start, select
#
# Key names are SDL scancode names, e.g. Z, Space, Return, Left Shift,
# Left Ctrl, Keypad 8, F1. The full list is at
# https://wiki.libsdl.org/SDL2/SDL_Scancode (use the names, not the
# SDL_SCANCODE_ constants). Names are not case-sensitive.
#
# Keys are matched by their position on the keyboard, so on a non-QWERTY
# layout "Z" means the key where Z is on a US keyboard.
#
# To give a button more than one key, repeat its line. A button left out of
# this file keeps its default key. Lines starting with # are ignored.
#
# Avoid Esc and Tab, which the debug GUI uses.
# Changes take effect the next time the game starts.

cross    = Z
square   = X
circle   = C
triangle = S

l1 = A
r1 = D
l2 = Q
r2 = E
l3 = 1
r3 = 3

up    = Up
down  = Down
left  = Left
right = Right

start  = Return
select = Space
