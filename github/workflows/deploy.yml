name: Crash Bandicoot

on:
  push:
    branches: ["main"] # Cambia esto por el nombre de tu rama

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Subir carpeta como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build-web/dist' # <-- Cambia esto por el nombre de tu carpeta
      - name: Crash Bandicoot
        id: deployment
        uses: actions/deploy-pages@v4
